<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | ToonNest</title>
    <link rel="icon" type="image/png" href="images/logo2.jpg">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-page">

    <main class="login-main">

        <section class="login-card">

            <a href="index.html" class="login-logo">
                Toon<span>Nest</span>
            </a>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Sign in to enjoy your favorite classic cartoons.
            </p>

            <form id="login-form">

                <div class="login-field">
                    <label for="username">Username</label>
                    <input type="text" id="username" placeholder="Enter your username" autocomplete="username" required>
                </div>

                <div class="login-field">
                    <label for="password">Password</label>
                    <input type="password" id="password" placeholder="Enter your password"
                        autocomplete="current-password" required>
                </div>

                <p id="login-error" class="login-error" role="alert"></p>

                <button type="submit" class="login-btn">
                    Login
                </button>

            </form>


            <!-- DEMO ACCOUNTS -->
            <div class="demo-accounts mt-4">
                <h5 class="text-center mb-3">🎬 Try ToonNest</h5>

                <div class="demo-account mb-3">
                    <h6>🛡️ Admin Account</h6>
                    <p class="mb-1">
                        Username: <code>emilys</code>
                    </p>
                    <p class="mb-0">
                        Password: <code>emilyspass</code>
                    </p>
                </div>

                <div class="demo-account">
                    <h6>👤 User Account</h6>
                    <p class="mb-1">
                        Username: <code>jacksone</code>
                    </p>
                    <p class="mb-0">
                        Password: <code>jacksonepass</code>
                    </p>
                </div>

                <p class="text-center mt-3 mb-0">
                    <small>Demo accounts are for testing purposes only.</small>
                </p>
            </div>


        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 All rights reserved | Eng: Aya Saeed</p>
    </footer>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
