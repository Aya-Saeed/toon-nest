<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.datatables.net/3.0.4/css/dataTables.bootstrap5.css">
    <link rel="icon" type="image/png" href="images/logo2.jpg">

    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <header class="navbar">

        <div class="navbar-container">

            <a href="#" class="logo">UserPortal</a>

            <nav>
                <a href="#" class="nav-link active">Dashboard</a>
            </nav>
            <button type="button" class="logout-btn" id="logout-btn">
                Logout
            </button>

        </div>

    </header>

    <main>

        <div class="dashboard">
            <h1>Users Dashboard</h1>


            <form id="user-form">

                <div class="row g-2 align-items-end">

                    <div class="col-lg-3 col-md-6">
                        <label for="firstName" class="form-label">Name</label>
                        <input type="text" id="firstName" class="form-control" placeholder="Enter name" required>
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <label for="age" class="form-label">Age</label>
                        <input type="number" id="age" class="form-control" placeholder="Enter age" required>
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="Enter email" required>
                    </div>

                    <div class="col-lg-3 col-md-6">
                        <label for="phone" class="form-label">Phone</label>
                        <input type="tel" id="phone" class="form-control" placeholder="Enter phone" required>
                    </div>

                    <div class="text-start mt-3">
                        <button type="submit" class="btn">
                            Add User
                        </button>
                    </div>

                </div>

            </form>

            <div id="loader" class="spinner"></div>
            <div id="errorMsg"></div>


            <div class="table-responsive">
                <table id="users" class="table">

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Image</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Age</th>
                            <th>Actions</th>
                        </tr>
                    </thead>

                    <tbody>

                    </tbody>

                </table>
            </div>
            <!-- Edit User Modal -->

            <div class="modal fade" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true">

                <div class="modal-dialog modal-dialog-centered">

                    <div class="modal-content">

                        <div class="modal-header">

                            <h5 class="modal-title" id="editModalLabel">
                                Edit User
                            </h5>

                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close">
                            </button>

                        </div>

                        <div class="modal-body">

                            <form id="edit-form">

                                <div class="row g-3">

                                    <div class="col-md-6">
                                        <label for="editFirstName" class="form-label">
                                            First Name
                                        </label>

                                        <input type="text" id="editFirstName" class="form-control" required>
                                    </div>


                                    <div class="col-md-6">
                                        <label for="editAge" class="form-label">
                                            Age
                                        </label>

                                        <input type="number" id="editAge" class="form-control" required>
                                    </div>

                                    <div class="col-md-6">
                                        <label for="editEmail" class="form-label">
                                            Email
                                        </label>

                                        <input type="email" id="editEmail" class="form-control" required>
                                    </div>

                                    <div class="col-12">
                                        <label for="editPhone" class="form-label">
                                            Phone
                                        </label>

                                        <input type="tel" id="editPhone" class="form-control" required>
                                    </div>

                                    <div class="col-12">

                                        <button type="submit" class="btn  w-100">
                                            Save Changes
                                        </button>

                                    </div>

                                </div>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </main>

    <footer class="site-footer">
        <p>© 2026 All rights reserved | Eng: Aya Saeed</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.datatables.net/3.0.4/js/dataTables.js"></script>

    <script src="https://cdn.datatables.net/3.0.4/js/dataTables.bootstrap5.js"></script>

    <script src="js/api.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
