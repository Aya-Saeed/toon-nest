<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ToonNest</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="icon" type="image/png" href="images/logo2.jpg">


    <link rel="stylesheet" href="css/style.css">
    <style>
        body {
            visibility: hidden;
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="navbar-container">

            <a href="movies.html" class="logo">
                ToonNest
            </a>

            <div class="navbar-actions">
                <input type="text" id="search-input" placeholder="Search cartoons...">

                <button id="logout-btn" class="logout-btn">
                    Logout
                </button>
            </div>

        </div>
    </nav>


    <main>

        <section class="hero">
            <div class="hero-content">

                <h1>Classic Cartoons</h1>

                <p>
                    Timeless cartoons. One place.
                </p>

                <button id="explore-btn">
                    Explore Cartoons
                </button>

            </div>
        </section>


        <section class="movies-section">

            <div id="continue-watching-section" hidden>
                <h2>Continue Watching</h2>
                <div id="continue-watching" class="movies-grid"></div>
            </div>

            <h2>Classic Animation</h2>

            <div id="movies-loading" hidden>
                Loading cartoons...
            </div>

            <div id="movies-error" hidden>
                Failed to load cartoons. Please try again.
            </div>

            <div id="movies" class="movies-grid"></div>

            <p id="no-results" hidden>
                No cartoons found. Try another search.
            </p>

        </section>


    </main>

    <footer class="site-footer">
        <p>© 2026 All rights reserved | Eng: Aya Saeed</p>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/movies.js"></script>

</body>

</html>
